# Production-like stack (ADR-020): PostgreSQL + orchestrator server (+ optional web UI).
#   cp .env.example .env    # set ORCH_ENCRYPTION_KEY, POSTGRES_PASSWORD, APP_ORIGIN, GitHub and provider secrets
#   docker compose up -d --build
#   docker compose --profile web up -d --build   # additionally builds apps/web (requires apps/web/Dockerfile)

name: ai-orchestrator

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: orchestrator
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator -d orchestrator"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: ai-orchestrator-server:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4000"
      SERVER_ROLE: all
      DATABASE_URL: postgres://orchestrator:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/orchestrator
      ORCH_ENCRYPTION_KEY: ${ORCH_ENCRYPTION_KEY:?set ORCH_ENCRYPTION_KEY in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      PROJECT_ACL: ${PROJECT_ACL:-enforced}
    ports:
      - "${SERVER_PORT:-4000}:4000"
    volumes:
      - server-data:/data

  # Placeholder for the Next.js dashboard. It is only built with `--profile web` and needs apps/web/Dockerfile,
  # which the web work stream provides. The UI proxies /api to the server through ORCH_SERVER_URL.
  web:
    profiles: ["web"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ai-orchestrator-web:local
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      NODE_ENV: production
      ORCH_SERVER_URL: http://server:4000
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  postgres-data:
  server-data:
