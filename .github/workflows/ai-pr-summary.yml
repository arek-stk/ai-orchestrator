name: AI pull request summary

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ai-pr-summary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Check AI availability
    runs-on: ubuntu-latest
    # Forks never receive secrets; drafts and bot PRs are skipped.
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      available: ${{ steps.token.outputs.available }}
    steps:
      - id: token
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          if [ -n "$COPILOT_GITHUB_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Repository secret COPILOT_GITHUB_TOKEN is not set; skipping AI summary."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

  summary:
    name: Summarise changes
    needs: check
    if: needs.check.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install Copilot CLI
        run: npm install -g --ignore-scripts @github/copilot@1.0.83

      - name: Collect diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          mkdir -p "$RUNNER_TEMP/pr"
          printf '%s' "$PR_TITLE" | head -c 300 > "$RUNNER_TEMP/pr/title.txt"
          git diff --stat "$BASE_SHA...$HEAD_SHA" | tail -n 60 > "$RUNNER_TEMP/pr/stat.txt"
          git diff "$BASE_SHA...$HEAD_SHA" -- . ':(exclude)package-lock.json' ':(exclude)**/drizzle/meta/**' | head -c 60000 > "$RUNNER_TEMP/pr/diff.txt"

      - name: Summarise with GitHub Copilot
        id: ai
        uses: actions/ai-inference@2c43c91ae16266ca159d311430343c67a5ffa222 # v3
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        with:
          prompt-file: .github/prompts/pr-summary.prompt.yml
          file_input: |
            title: ${{ runner.temp }}/pr/title.txt
            stat: ${{ runner.temp }}/pr/stat.txt
            diff: ${{ runner.temp }}/pr/diff.txt

      - name: Post or update the summary comment
        env:
          GH_TOKEN: ${{ github.token }}
          RESPONSE_FILE: ${{ steps.ai.outputs.response-file }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          marker='<!-- ai-pr-summary -->'
          {
            echo "$marker"
            echo "## 🤖 AI summary"
            echo
            head -c 6000 "$RESPONSE_FILE" | sed 's/@/@ /g'
            echo
            echo
            echo "<sub>Generated by GitHub Copilot for commit ${GITHUB_SHA::7}; may be inaccurate.</sub>"
          } > "$RUNNER_TEMP/summary.md"
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F "body=@$RUNNER_TEMP/summary.md" >/dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/summary.md"
          fi
