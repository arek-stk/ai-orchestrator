name: Release

on:
  push:
    branches: [main]
  # Dispatched by the milestone release workflow after bot merges, which trigger no push workflows.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release please
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      # Maintains a release PR with version bump and CHANGELOG from Conventional Commits;
      # merging that PR creates the GitHub release and tag.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The release PR and releases are created with GITHUB_TOKEN and trigger no workflows by themselves. The milestone
      # release workflow requests CI for the release PR and finishes completed milestones (ADR-012 addendum).
      - name: Hand over to milestone release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run milestone-release.yml --repo "$REPO" --ref "$DEFAULT_BRANCH"
