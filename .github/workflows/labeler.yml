name: Labeler

# pull_request_target is safe here: the labeler only reads changed file paths and never checks out PR code.
on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label pull request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          sync-labels: true
