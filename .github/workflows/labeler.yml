name: Labeler

# pull_request_target is safe here: the labeler only reads changed file paths and never checks out PR code.
on:
  pull_request_target:

permissions:
  contents: read

jobs:
  label:
    name: Label pull request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
