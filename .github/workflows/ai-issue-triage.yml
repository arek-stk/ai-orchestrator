name: AI issue triage

on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: ai-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Check AI availability
    runs-on: ubuntu-latest
    if: github.event.issue.user.type != 'Bot'
    outputs:
      available: ${{ steps.token.outputs.available }}
    steps:
      - id: token
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          if [ -n "$COPILOT_GITHUB_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Repository secret COPILOT_GITHUB_TOKEN is not set; skipping AI triage."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

  triage:
    name: Label and summarise
    needs: check
    if: needs.check.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/prompts
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      # Untrusted issue text is passed through files, never interpolated into shell commands.
      - name: Write issue content
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          mkdir -p "$RUNNER_TEMP/triage"
          printf '%s' "$ISSUE_TITLE" | head -c 500 > "$RUNNER_TEMP/triage/title.txt"
          printf '%s' "${ISSUE_BODY:-(no description)}" | head -c 20000 > "$RUNNER_TEMP/triage/body.txt"

      - name: Classify with GitHub Copilot
        id: ai
        uses: actions/ai-inference@v3
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        with:
          prompt-file: .github/prompts/issue-triage.prompt.yml
          file_input: |
            title: ${{ runner.temp }}/triage/title.txt
            body: ${{ runner.temp }}/triage/body.txt

      - name: Apply allow-listed labels and comment
        env:
          GH_TOKEN: ${{ github.token }}
          RESPONSE_FILE: ${{ steps.ai.outputs.response-file }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          allowed='["bug","enhancement","docs","question","security","core","db","integrations","server","web","ci","dependencies"]'
          json=$(sed -e '/^```/d' "$RESPONSE_FILE" | tr -d '\r')
          if ! printf '%s' "$json" | jq -e 'type == "object"' >/dev/null 2>&1; then
            echo "::warning::Model response was not a JSON object; nothing applied."
            exit 0
          fi
          labels=$(printf '%s' "$json" | jq -r --argjson allowed "$allowed" \
            '[.labels[]? | select(type == "string") | select(. as $l | $allowed | index($l))] | unique | .[:3] | join(",")')
          summary=$(printf '%s' "$json" | jq -r '(.summary // "") | tostring | .[0:1200] | gsub("@"; "@ ")')
          if [ -n "$labels" ]; then
            gh issue edit "$ISSUE" --repo "$REPO" --add-label "$labels"
          fi
          if [ -n "$summary" ]; then
            {
              echo "🤖 **AI triage** — generated by GitHub Copilot, may be inaccurate."
              echo
              echo "$summary"
              echo
              echo "Suggested labels: ${labels:-none}"
            } > "$RUNNER_TEMP/comment.md"
            gh issue comment "$ISSUE" --repo "$REPO" --body-file "$RUNNER_TEMP/comment.md"
          fi
